services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unisinos
      POSTGRES_USER: unisinos
      POSTGRES_PASSWORD: unisinos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unisinos -d unisinos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/unisinos
      DB_USERNAME: unisinos
      DB_PASSWORD: unisinos
    ports:
      - "8080:8080"

volumes:
  pgdata:
