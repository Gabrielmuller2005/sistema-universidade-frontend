spring:
  application:
    name: unisinos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unisinos}
    username: ${DB_USERNAME:unisinos}
    password: ${DB_PASSWORD:unisinos}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}
